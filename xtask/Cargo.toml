[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Dev-only data generator for moult; never published"

[dependencies]
quick-xml = "0.42"
flate2 = "1.1"
sha2 = "0.11"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
moult = { path = "..", optional = true }

[features]
# The only command that uses the moult crate. Without it, xtask builds without
# depending on src/data.rs, so `gen-data` still works when that file is broken.
inflect = ["dep:moult"]

[package]
name = "moult"
version = "0.3.0"
edition = "2021"
rust-version = "1.70"
description = "English noun inflection and lemmatization (singularize, pluralize, lemmatize) checked against Open English WordNet"
# The code is Apache-2.0; the compiled-in word tables are derived from Open
# English WordNet and stay under its CC-BY-4.0 (see LICENSE-DATA).
license = "Apache-2.0 AND CC-BY-4.0"
repository = "https://github.com/Trivyn/moult"
keywords = ["inflection", "pluralize", "singularize", "wordnet", "lemmatize"]
categories = ["text-processing"]
readme = "README.md"
# Paths are anchored with a leading "/": an unanchored "LICENSE" matches a file
# of that name at any depth (e.g. inside an ignored download cache).
include = [
    "/src/**/*",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/LICENSE-DATA",
]

[dependencies]

[workspace]
members = ["xtask"]
